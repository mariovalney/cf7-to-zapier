server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # Easypanel (Traefik) terminates TLS in front of this container, so redirects must keep the
    # original host and scheme.
    absolute_redirect off;

    charset utf-8;
    charset_types application/json;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # `add_header` inside a location replaces this set, so locations that add their own repeat it.
    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # There is no homepage yet, and the plugin's "Plugin URI" points here.
    location = / {
        return 302 https://wordpress.org/plugins/cf7-to-zapier/;
    }

    # The plugin admin loads this file with $.getJSON from each WordPress site's own domain, so it
    # needs CORS. Same headers GitHub Pages used to send.
    location = /templates.json {
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin * always;
        expires 10m;
    }

    location / {
        try_files $uri =404;
    }
}
