server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Easypanel (Traefik) terminates TLS in front of this container, so redirects must keep the
    # original host and scheme.
    absolute_redirect off;

    charset utf-8;
    charset_types application/json;

    gzip on;
    gzip_types text/css application/json;
    gzip_min_length 1024;

    # Pages share the header, footer and docs menu from /partials through server-side includes.
    ssi on;

    # `add_header` inside a location replaces this set, so locations that add their own repeat it.
    add_header X-Content-Type-Options nosniff always;

    # One address per page: /docs/ redirects to /docs.
    rewrite ^/(.+)/$ /$1 permanent;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The plugin admin loads this file with $.getJSON from each WordPress site's own domain, so it
    # needs CORS. Same headers GitHub Pages used to send.
    location = /templates.json {
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin * always;
        expires 10m;
    }

    # Only reachable through the includes, not as pages of their own.
    location /partials/ {
        internal;
    }

    # Cloudflare caches .css and .js for hours when the origin says nothing, so a deploy would keep
    # the old styles. no-cache makes it check with nginx (ETag) before reusing them.
    location ~* \.(css|js)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }

    # Pages that moved. Released readme files link to the old addresses, so they must keep working.
    location ~ ^/docs/make-multiple-webhooks-optionals(\.html)?$ {
        return 301 /docs/how-to/make-multiple-webhooks-optionals;
    }

    # Doc sections have no page of their own: send them to the index.
    location ~ ^/docs/(how-to|features)$ {
        return 302 /docs;
    }

    # /docs/some-page -> docs/some-page.html, /docs -> docs/index.html, anything else -> 404.html.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
